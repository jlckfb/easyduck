[Unit]
After=alsa-restore.service

[Service]
# Override the default voice seed in /etc/robot/voice.env.
Environment=VOICE_SEED=3239431280
EnvironmentFile=-/etc/robot/voice.env
ExecStartPre=-/usr/bin/amixer -c 0 sset "Playback Path" SPK
ExecStartPre=-/opt/robot/daemon/current/bin/sounds ensure-bank --dir /var/lib/robot/sounds --seed ${VOICE_SEED}
