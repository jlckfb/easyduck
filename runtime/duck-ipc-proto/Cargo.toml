[package]
name = "duck-ipc-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IPC contracts between the robot's services and their clients"

# Shared types stay lightweight; transport and service behavior belong to callers.
[dependencies]
serde.workspace = true
serde_json.workspace = true
semver.workspace = true

# `tempfile` only for the identity round-trip test: it needs a writable runtime root, and a
# test cannot have /run.
[dev-dependencies]
tempfile = "3.27.0"

# Fixtures for tests, in this crate and in its consumers. Adds no dependencies; see
# `src/lib.rs::test_support` for why it is shared rather than copied per crate.
[features]
test-support = []
