# Current TaishanPi 1M + HD1910 deployment workspace.
[workspace]
resolver = "3"
members = ["robotd", "padd", "robotctl", "sounds", "duck-control", "duck-ipc-proto", "robotd-params", "kinematics"]
default-members = ["robotd", "padd", "robotctl", "sounds"]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
tokio = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
tracing = "0.1"
tracing-subscriber = "0.3"
