[package]
name = "robotd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TaishanPi HD1910 robot control daemon"

[dependencies]
duck-ipc-proto = { path = "../duck-ipc-proto" }
duck-control = { path = "../duck-control" }
robotd-params = { path = "../robotd-params" }
kinematics = { path = "../kinematics" }
sounds = { path = "../sounds" }
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "signal",
    "sync",
] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libc = "0.2"
thiserror.workspace = true
toml = "0.9"
# Lock-free single-value slots for the intent hand-off: the control loop does one
# atomic load per tick and can never be held up by an IPC task writing the other side.
arc-swap = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
